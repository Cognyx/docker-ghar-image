name: image-build
on:
  push:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - ".github/workflows/image-build.yaml"
      - "!**.md"
  pull_request:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - ".github/workflows/image-build.yaml"
      - "!**.md"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5

      - name: Authenticate to GCP
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        timeout-minutes: 1
        with:
          credentials_json: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_SA_KEY }}

      - name: Login to GAR
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        timeout-minutes: 1
        with:
          registry: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_LOGIN_SERVER }}
          username: _json_key
          password: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_SA_KEY }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        timeout-minutes: 1
        with:
          images: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_LOGIN_SERVER }}/cognyx-471812/ghar-image
          tags: |
            type=raw,value={{branch}}-{{sha}}-{{date 'X'}}
            type=raw,value=latest

      - name: PR Tags
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "tags=test-${{ github.sha }}" >> $GITHUB_ENV
        timeout-minutes: 1

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 10
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha,scope=image-build
          cache-to: type=gha,mode=max,scope=image-build
          push: ${{ github.ref_name == 'main' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=min,inline-only=true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && env.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
