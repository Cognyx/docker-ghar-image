name: image-build
on:
  push:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - ".github/workflows/image-build.yaml"
      - "!**.md"
  pull_request:
    branches:
      - "main"
    paths:
      - "Dockerfile"
      - ".github/workflows/image-build.yaml"
      - "!**.md"
  # Weekly rebuild so apt-get upgrade picks up OS security fixes (COM-853, COM-1264);
  # the image otherwise only changed when the Dockerfile did.
  # 05:17 UTC Monday, after the GKE maintenance window (Monday 00:30-04:30 UTC).
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        timeout-minutes: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        timeout-minutes: 5

      - name: Authenticate to GCP
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: google-github-actions/auth@v3
        timeout-minutes: 1
        with:
          credentials_json: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_SA_KEY }}

      - name: Login to GAR
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        timeout-minutes: 1
        with:
          registry: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_LOGIN_SERVER }}
          username: _json_key
          password: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_SA_KEY }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        timeout-minutes: 1
        with:
          images: ${{ secrets.GOOGLE_ARTIFACT_REGISTRY_LOGIN_SERVER }}/cognyx-471812/ghar-image
          tags: |
            type=raw,value={{branch}}-{{sha}}-{{date 'X'}}
            type=raw,value=latest

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        # 10 min was too short once the cache missed (#35 timed out).
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha,scope=image-build
          # A scheduled or manual rebuild must not reuse the cached apt layer.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          load: true
          push: false
          provenance: false
          tags: ghar-image:smoke

      # A weekly apt-get upgrade must not push an image that breaks CI.
      - name: Smoke Test
        timeout-minutes: 2
        run: |
          docker run --rm --entrypoint sh ghar-image:smoke -c '
            set -e
            go version
            node --version
            python3 --version
            sqlc version
            docker compose version
            /opt/hostedtoolcache/node/*/x64/bin/node --version
            /opt/hostedtoolcache/Python/*/x64/bin/python3 --version
            test -w /opt/hostedtoolcache
          '

      # Same builder, no external cache source: every layer comes from the build above,
      # so the pushed image is the one that passed the smoke test.
      - name: Push Docker Image
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          file: Dockerfile
          cache-to: type=gha,mode=max,scope=image-build
          push: true
          provenance: mode=min,inline-only=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
